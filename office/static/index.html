<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pixel Office Firm</title>
<style>
  :root { --bg:#17141f; --gold:#e8c56a; --green:#4caf6e; --red:#e05555; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:#eee; font-family:"Courier New",monospace;
         display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  #bar { display:flex; align-items:center; gap:14px; padding:10px 16px;
         background:#0d0b12; border-bottom:3px solid #2a2438; }
  #bar h1 { font-size:17px; letter-spacing:3px; color:var(--gold); }
  #bar h1 span { color:#8d79c9; }
  #ticker-in { background:#000; color:#fff; border:2px solid var(--gold);
               font:inherit; font-size:15px; padding:6px 10px; width:110px;
               text-transform:uppercase; }
  #go { background:var(--gold); color:#111; border:none; font:inherit;
        font-weight:bold; font-size:14px; padding:8px 18px; cursor:pointer;
        letter-spacing:2px; }
  #go:disabled { background:#665c3d; cursor:wait; }
  #status { font-size:12px; color:#9c92b8; margin-left:auto; }
  #wrap { flex:1; display:flex; min-height:0; }
  #floor { flex:1; display:block; image-rendering:pixelated; }
  #panel { width:340px; background:#0d0b12; border-left:3px solid #2a2438;
           padding:14px; overflow-y:auto; display:none; font-size:12.5px; }
  #panel.show { display:block; }
  #panel h2 { color:var(--gold); font-size:14px; letter-spacing:2px; margin-bottom:8px; }
  .tier { display:inline-block; padding:2px 8px; margin:2px 4px 2px 0;
          border:1px solid #555; font-weight:bold; }
  .tier.positive,.tier.strong_positive { color:var(--green); border-color:var(--green); }
  .tier.negative,.tier.strong_negative { color:var(--red); border-color:var(--red); }
  .tier.neutral { color:var(--gold); border-color:var(--gold); }
  #panel li { margin:8px 0 8px 16px; color:#c9c2dd; line-height:1.45; }
  #panel .path { color:#7a90c9; word-break:break-all; margin-top:10px; }
  #tape { background:#000; border-top:3px solid #2a2438; padding:7px 0;
          white-space:nowrap; overflow:hidden; font-size:13px; }
  #tape-inner { display:inline-block; padding-left:100%;
                animation:scroll 40s linear infinite; }
  @keyframes scroll { to { transform:translateX(-100%); } }
  .up { color:var(--green); } .down { color:var(--red); } .flat { color:#999; }
</style>
</head>
<body>
<div id="bar">
  <h1>PIXEL OFFICE FIRM <span>&#9670;</span></h1>
  <input id="ticker-in" placeholder="RIVN" maxlength="5">
  <button id="go">&#9654; ANALYZE</button>
  <div id="status">floor idle</div>
</div>
<div id="wrap">
  <canvas id="floor" width="980" height="600"></canvas>
  <div id="panel"></div>
</div>
<div id="tape"><div id="tape-inner">loading tape…</div></div>

<script>
const cv = document.getElementById('floor'), cx = cv.getContext('2d');
const statusEl = document.getElementById('status');
const AGENTS = {
  tom:   {x:150, y:210, c:'#5bc0eb', role:'TECHNICALS'},
  john:  {x:150, y:400, c:'#8ee06e', role:'FUNDAMENTALS'},
  david: {x:390, y:210, c:'#f2d052', role:'NEWS & MACRO'},
  amy:   {x:390, y:400, c:'#d977d9', role:'SENTIMENT'},
  baldy: {x:700, y:190, c:'#f0a35e', role:'BULL'},
  hairy: {x:880, y:190, c:'#c96a6a', role:'BEAR'},
  theo:  {x:790, y:470, c:'#b9a3f5', role:'REPRESENTATIVE'},
};
const state = {};   // agent -> {mode, note, ts}
for (const a in AGENTS) state[a] = {mode:'idle', note:'', ts:0};
let runTicker = null;

function px(n){ return Math.round(n); }
function drawFloor(){
  cx.clearRect(0,0,cv.width,cv.height);
  // rooms
  cx.fillStyle='#8a6642'; cx.fillRect(20,60,540,510);           // analyst floor
  cx.fillStyle='#7a5a3a';
  for(let x=20;x<560;x+=40) cx.fillRect(x,60,4,510);            // planks
  cx.fillStyle='#4a5b8c'; cx.fillRect(590,60,370,260);          // debate room
  cx.fillStyle='#57456e'; cx.fillRect(590,350,370,220);         // theo's office
  cx.strokeStyle='#141021'; cx.lineWidth=6;
  [[20,60,540,510],[590,60,370,260],[590,350,370,220]].forEach(r=>cx.strokeRect(...r));
  // labels
  cx.fillStyle='#e8c56a'; cx.font='bold 13px Courier New'; cx.textAlign='left';
  cx.fillText('ANALYST FLOOR',36,84); cx.fillText('RESEARCH DEBATE',606,84);
  cx.fillText('CLIENT ROOM',606,374);
  // debate table
  cx.fillStyle='#6b4b2a'; cx.beginPath();
  cx.ellipse(790,215,85,42,0,0,7); cx.fill();
  // status header
  cx.fillStyle = runTicker ? '#4caf6e' : '#666';
  cx.fillText(runTicker ? '● ANALYZING '+runTicker : '○ AWAITING CLIENT REQUEST', 36, 48);
}
function drawDesk(x,y){
  cx.fillStyle='#5c3f24'; cx.fillRect(x-46,y-58,92,34);
  cx.fillStyle='#cfd6e4'; cx.fillRect(x-16,y-54,32,20);   // monitor
  cx.fillStyle='#233'; cx.fillRect(x-13,y-51,26,14);
}
function drawAgent(name){
  const a = AGENTS[name], s = state[name];
  drawDesk(a.x,a.y);
  // body
  const glow = s.mode==='work'||s.mode==='write';
  cx.save();
  if (glow){ cx.shadowColor=a.c; cx.shadowBlur=18; }
  cx.fillStyle = s.mode==='idle' ? shade(a.c,-45) : a.c;
  cx.fillRect(a.x-13,a.y-18,26,26);
  cx.fillRect(a.x-9,a.y-30,18,14);                        // head
  cx.restore();
  cx.fillStyle='#111';
  cx.fillRect(a.x-5,a.y-26,3,3); cx.fillRect(a.x+2,a.y-26,3,3);   // eyes
  // done badge / typing dots
  if (s.mode==='done'){ cx.fillStyle='#4caf6e'; cx.font='bold 15px Courier New';
    cx.textAlign='center'; cx.fillText('✓', a.x+22, a.y-22); }
  if (glow){ const n = Math.floor(Date.now()/350)%4;
    cx.fillStyle='#fff'; cx.textAlign='center';
    cx.fillText('.'.repeat(n||1), a.x, a.y-40); }
  // name + role tags
  cx.textAlign='center'; cx.font='bold 12px Courier New';
  cx.fillStyle='#fff'; cx.fillText(name.toUpperCase(), a.x, a.y+26);
  cx.font='10px Courier New';
  cx.fillStyle='#000'; const w = cx.measureText(a.role).width+10;
  cx.fillRect(a.x-w/2, a.y+31, w, 14);
  cx.fillStyle=a.c; cx.fillText(a.role, a.x, a.y+41);
  // speech bubble (12s lifetime)
  if (s.note && Date.now()/1000 - s.ts < 12) bubble(a.x, a.y-66, s.note);
}
function bubble(x,y,text){
  const t = text.length>44 ? text.slice(0,43)+'…' : text;
  cx.font='11px Courier New';
  const w = cx.measureText(t).width+14;
  const bx = Math.min(Math.max(x-w/2, 8), cv.width-w-8);
  cx.fillStyle='#fffef0'; cx.fillRect(bx, y-16, w, 20);
  cx.strokeStyle='#222'; cx.lineWidth=2; cx.strokeRect(bx, y-16, w, 20);
  cx.fillStyle='#111'; cx.textAlign='left'; cx.fillText(t, bx+7, y-2);
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,(n>>16)+amt),g=Math.max(0,((n>>8)&255)+amt),b=Math.max(0,(n&255)+amt);
  return `rgb(${r},${g},${b})`;
}
function frame(){ drawFloor(); for(const a in AGENTS) drawAgent(a); requestAnimationFrame(frame); }
frame();

// ---- events (SSE)
const es = new EventSource('/api/events');
es.onmessage = (m)=>{
  let e; try { e = JSON.parse(m.data); } catch { return; }
  if (e.agent === 'floor'){
    if (e.state==='run_start'){ runTicker = e.ticker; setBusy(true);
      for(const a in AGENTS) state[a]={mode:'idle',note:'',ts:0}; hidePanel(); }
    if (e.state==='run_done'||e.state==='error'){ setBusy(false);
      if (e.state==='run_done') showVerdict(e.ticker);
      statusEl.textContent = e.state==='run_done' ? 'run complete' : 'run failed';
      runTicker = null; }
    return;
  }
  if (!(e.agent in state)) return;
  const mode = {start:'work', work:'work', write:'write', done:'done', error:'idle'}[e.state]||'idle';
  state[e.agent] = {mode, note:e.note||'', ts:e.ts};
  statusEl.textContent = e.agent.toUpperCase()+': '+(e.note||e.state);
};

// ---- analyze button
const btn = document.getElementById('go'), input = document.getElementById('ticker-in');
function setBusy(b){ btn.disabled=b; btn.textContent = b?'⏳ WORKING':'▶ ANALYZE'; }
btn.onclick = async ()=>{
  const t = input.value.trim().toUpperCase(); if(!t) return;
  const r = await fetch('/api/analyze/'+t, {method:'POST'});
  const d = await r.json();
  if (d.error){ statusEl.textContent = d.error; return; }
  setBusy(true);
};

// ---- verdict panel
const panel = document.getElementById('panel');
function hidePanel(){ panel.classList.remove('show'); }
async function showVerdict(t){
  const r = await fetch('/api/verdict/'+t); if(!r.ok) return;
  const v = await r.json();
  panel.innerHTML = `<h2>${t} — FIRM VERDICT</h2>
    <div><span class="tier ${v.stance}">OVERALL ${(v.stance||'').replace('_',' ').toUpperCase()}</span></div>
    <div style="margin:8px 0">
      <span class="tier ${v.financial_outlook}">FIN ${(v.financial_outlook||'?').replace('_',' ')}</span>
      <span class="tier ${v.engineering_health}">ENG ${(v.engineering_health||'?').replace('_',' ')}</span>
    </div>
    <div>confidence: <b>${v.confidence}</b> &middot; horizon: ${v.horizon_months}mo &middot; ${v.date}</div>
    <ul>${(v.key_findings||[]).map(k=>`<li>${k}</li>`).join('')}</ul>
    <div class="path">${v.path}</div>`;
  panel.classList.add('show');
}

// ---- ticker tape
async function tape(){
  try {
    const r = await fetch('/api/tape'); const d = await r.json();
    document.getElementById('tape-inner').innerHTML = Object.entries(d)
      .map(([t,m])=>{
        if (m.pct==null) return `<span class="flat">${t} ?</span>`;
        const cls = m.pct>0.05?'up':m.pct<-0.05?'down':'flat';
        const sign = m.pct>0?'+':'';
        return `<span class="${cls}">&nbsp;&nbsp;${t} ${sign}${m.pct.toFixed(2)}%&nbsp;&nbsp;</span>`;
      }).join('▪');
  } catch { /* server warming up */ }
}
tape(); setInterval(tape, 5*60*1000);
</script>
</body>
</html>
