<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pixel Office Firm</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0a14; --s1:#120e1c; --card:#161022; --s3:#201936;
          --edge:#332a4a; --gold:#e2bd6b; --brass:linear-gradient(180deg,#f0d080,#c9a04d);
          --green:#46c47c; --red:#e05a5a; --dim:#857a9e;
          --px:"Press Start 2P","Courier New",monospace;
          --mono:"JetBrains Mono","Courier New",monospace; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:#e6e0f2; font-family:var(--mono); font-size:12px;
         display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.09) 0 1px, transparent 1px 3px); }
  .card { background:linear-gradient(180deg,var(--card),var(--s1));
          border:2px solid var(--edge);
          box-shadow:inset 0 1px 0 rgba(255,255,255,.045), 0 3px 10px rgba(0,0,0,.45); }

  #bar { display:flex; align-items:center; gap:12px; padding:10px 14px;
         background:#0a0812; border-bottom:3px solid var(--edge); }
  #bar h1 { font-family:var(--px); font-size:13px; letter-spacing:1px; color:var(--gold);
            text-shadow:0 2px 0 rgba(0,0,0,.6); }
  #bar h1 span { color:#8d79c9; }
  #ticker-in { background:#000; color:#fff; border:2px solid var(--gold);
               font-family:var(--px); font-size:11px; padding:7px 9px; width:104px;
               text-transform:uppercase; }
  button { font-family:var(--px); font-size:10px; padding:9px 14px;
           cursor:pointer; letter-spacing:0; border:none;
           box-shadow:0 2px 0 rgba(0,0,0,.5); }
  button:hover:not(:disabled) { filter:brightness(1.12); }
  #go { background:var(--brass); color:#221a08; }
  #digest-btn { background:linear-gradient(180deg,#a693dd,#7a63b8); color:#171028; }
  button:disabled { opacity:.45; cursor:wait; }
  #status { font-size:11.5px; color:var(--dim); margin-left:auto; max-width:420px;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #macro { display:flex; gap:8px; padding:8px 10px; }
  .m-card { flex:1; padding:6px 10px; display:flex; align-items:center; gap:10px; }
  .m-card .lab { font-family:var(--px); font-size:7px; color:var(--dim); }
  .m-card .val { font-size:16px; color:var(--gold); font-weight:bold; }
  .m-card canvas { margin-left:auto; }

  #main { flex:1; display:flex; gap:8px; padding:0 10px; min-height:0; position:relative; }
  #digest { width:290px; padding:10px; overflow-y:auto; font-size:11.5px; }
  #digest h2, #verdict h2 { color:var(--gold); font-family:var(--px); font-size:9px;
    letter-spacing:0; margin-bottom:8px; padding-bottom:6px;
    border-bottom:1px solid var(--edge); }
  #digest h2::before { content:"☼ "; } #verdict h2::before { content:"◆ "; }
  #digest h3 { color:#8d79c9; font-size:11px; margin:10px 0 4px; letter-spacing:1px; }
  #digest p, #digest li { color:#c9c2dd; line-height:1.5; margin:4px 0; }
  #digest table { border-collapse:collapse; width:100%; font-size:10px; margin:4px 0; }
  #digest td { border:1px solid var(--edge); padding:2px 4px; }
  #digest p { line-height:1.6; margin:6px 0; }
  .mover { border:1px solid var(--edge); border-left:3px solid var(--gold);
           background:rgba(226,189,107,.05); padding:7px 9px; margin:8px 0;
           line-height:1.55; }
  .mover > b:first-child { font-family:var(--px); font-size:8px; color:var(--gold); }
  .tk { color:#9db4e8; cursor:pointer; border-bottom:1px dotted #9db4e8; }
  .tk:hover { color:#c9d9ff; }
  #floor-wrap { flex:1; display:flex; flex-direction:column; min-width:0; }
  #floor { flex:1; width:100%; min-height:0; display:block; image-rendering:pixelated;
           cursor:default; }
  #verdict { width:290px; padding:10px; overflow-y:auto; font-size:11.5px; }
  .tier { display:inline-block; padding:2px 7px; margin:2px 4px 2px 0;
          border:1px solid #555; font-weight:bold; font-size:11px; }
  .tier.positive,.tier.strong_positive { color:var(--green); border-color:var(--green); }
  .tier.negative,.tier.strong_negative { color:var(--red); border-color:var(--red); }
  .tier.neutral { color:var(--gold); border-color:var(--gold); }
  #verdict li { margin:7px 0 7px 14px; color:#c9c2dd; line-height:1.45; }
  #verdict .path { color:#7a90c9; word-break:break-all; margin-top:8px; font-size:10px; }
  .hint { color:#6d6486; font-style:italic; }

  /* dossier overlay */
  #dossier { position:absolute; right:8px; top:8px; bottom:8px; width:360px; z-index:50;
             padding:12px; overflow-y:auto; font-size:11.5px; display:none;
             box-shadow:0 0 40px #000; }
  #dossier.show { display:block; }
  #dossier h2 { font-size:13px; letter-spacing:2px; margin-bottom:4px; }
  #dossier .close { float:right; cursor:pointer; color:var(--red); font-weight:bold; }
  #dossier .ev { margin:5px 0; color:#c9c2dd; line-height:1.4; }
  #dossier .ev .t { color:#6d6486; font-size:10px; }
  #dossier .report { border-top:1px solid var(--edge); margin-top:10px; padding-top:8px;
                     white-space:pre-wrap; font-size:10.5px; color:#b9b2cf;
                     max-height:45%; overflow-y:auto; }
  /* hover tooltip */
  #tip { position:fixed; z-index:60; background:#fffef0; color:#111; border:2px solid #222;
         font-size:11px; padding:4px 8px; pointer-events:none; display:none; max-width:280px; }

  #macro, #score, #tape, #console, #stages { flex-shrink:0; }
  #stages { display:none; gap:4px; padding:2px 10px 6px; }
  #stages.on { display:flex; }
  .stage { flex:1; text-align:center; font-family:var(--px); font-size:8px;
           padding:5px 0 4px; border:2px solid var(--edge); color:#5d5478;
           background:var(--card); }
  .stage.active { border-color:var(--gold); color:var(--gold);
                  animation:pulse 1.2s infinite; }
  .stage.done { border-color:var(--green); color:var(--green); }
  @keyframes pulse { 50% { background:#1d1830; } }
  #toast { position:fixed; top:52px; right:14px; z-index:120; display:flex;
           flex-direction:column; gap:6px; }
  .toast-msg { background:#2a1216; border:2px solid var(--red); color:#f0b9b9;
               padding:8px 12px; font-size:12px; max-width:360px;
               animation:fadein .3s; }
  .toast-msg.warn { background:#2a2412; border-color:var(--gold); color:#e8d9a8; }
  @keyframes fadein { from { opacity:0; transform:translateY(-6px); } }
  #console { height:86px; margin:6px 10px 0; padding:6px 8px; overflow-y:auto;
             font-size:10.5px; line-height:1.5; }
  #console .l { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #console .a { color:var(--gold); font-weight:bold; }
  #console .find { color:#8ee06e; }
  #console .t { color:#5d5478; }

  #score { display:grid; grid-template-columns:repeat(12,1fr); gap:6px; padding:8px 10px; }
  .s-cell { padding:5px 4px 4px; text-align:center; cursor:pointer;
            transition:box-shadow .15s, border-color .15s; }
  .s-cell:hover { border-color:var(--gold); box-shadow:0 0 10px rgba(226,189,107,.35); }
  .s-cell .t { font-family:var(--px); font-size:9px; }
  .s-cell .p { font-size:10.5px; }
  .s-cell .v { height:5px; margin-top:4px; background:#333; }
  .s-cell .age { font-size:9px; color:var(--dim); }

  #tape { background:#000; border-top:3px solid var(--edge); padding:6px 0;
          white-space:nowrap; overflow:hidden; font-size:12.5px; }
  #tape-inner { display:inline-block; padding-left:100%; animation:scroll 45s linear infinite; }
  @keyframes scroll { to { transform:translateX(-100%); } }
  .up { color:var(--green); } .down { color:var(--red); } .flat { color:#999; }
</style>
</head>
<body>
<div id="bar">
  <h1>PIXEL OFFICE FIRM <span>&#9670;</span></h1>
  <input id="ticker-in" placeholder="TSLA" maxlength="5">
  <button id="go">&#9654; ANALYZE</button>
  <button id="digest-btn">&#9788; RUN DIGEST</button>
  <div id="status">floor idle</div>
</div>
<div id="macro"></div>
<div id="stages"></div>
<div id="toast"></div>
<div id="main">
  <div id="digest" class="card"><h2>MORNING DIGEST</h2><p class="hint">no digest yet — hit ☼ RUN DIGEST</p></div>
  <div id="floor-wrap"><canvas id="floor"></canvas></div>
  <div id="verdict" class="card"><h2>VERDICT WALL</h2><p class="hint">run an analysis or click the scoreboard</p></div>
  <div id="dossier" class="card"></div>
</div>
<div id="console" class="card"><div class="l t">— activity console —</div></div>
<div id="score"></div>
<div id="tape"><div id="tape-inner">warming up the tape…</div></div>
<div id="tip"></div>

<script>
/* ============================ world model ============================ */
const W=980, H=560;
const cv=document.getElementById('floor'), cx=cv.getContext('2d');
function fit(){ const r=cv.parentElement.getBoundingClientRect();
  cv.width=W; cv.height=H; cv.style.width=r.width+'px';
  cv.style.height=Math.max(r.height,280)+'px'; }
window.addEventListener('resize',fit); setTimeout(fit,50);

const DESK={ tom:[135,190], john:[135,388], david:[365,190], amy:[365,388],
             baldy:[672,170], hairy:[898,170], theo:[785,455] };
const COFFEE=[498,540], COFFEE_M=[498,492], COOLER=[620,300];
const AGENTS={
  tom:  {c:'#5bc0eb',role:'TECHNICALS'},  john: {c:'#8ee06e',role:'FUNDAMENTALS'},
  david:{c:'#f2d052',role:'NEWS & MACRO'},amy:  {c:'#d977d9',role:'SENTIMENT'},
  baldy:{c:'#f0a35e',role:'BULL'},        hairy:{c:'#c96a6a',role:'BEAR'},
  theo: {c:'#b9a3f5',role:'REPRESENTATIVE'} };
for(const n in AGENTS){ const a=AGENTS[n];
  a.x=DESK[n][0]; a.y=DESK[n][1]; a.path=[]; a.mode='idle'; a.note=''; a.ts=0;
  a.history=[]; a.startTs=0; }
let runTicker=null;
const screens={ chart:null, headlines:[], sentiment:null, recalls:null, quote:null };
const AMBIENT=["coffee run ☕","stretching...","market's quiet...","checking the tape",
  "watering the plant","thinking about margins","refilling the mug","door's squeaky again"];

/* doorways: D1 connects analyst floor ↔ debate room, D2 debate ↔ client room */
const D1=[546,205], D2=[775,322];
function room(x,y){ if(x<546) return 'floor'; return y<322?'debate':'client'; }
function route(from,to){                          // waypoints through doors
  const a=room(...from), b=room(...to);
  if(a===b) return [to];
  if(a==='floor')  return b==='debate' ? [[532,205],[566,205],to]
                                       : [[532,205],[566,205],[775,300],[775,344],to];
  if(b==='floor')  return a==='debate' ? [[566,205],[532,205],to]
                                       : [[775,344],[775,300],[566,205],[532,205],to];
  return a==='debate' ? [[775,300],[775,344],to] : [[775,344],[775,300],to];
}
function pathTo(n,...pts){ const a=AGENTS[n]; a.path=[];
  let cur=[a.x,a.y];
  for(const p of pts){ a.path.push(...route(cur,p)); cur=p; } }
/* choreography: state event -> optional walk before settling at desk */
function choreo(n, st){
  if(st==='start'){
    if(n==='baldy'||n==='hairy') pathTo(n,DESK.tom,DESK.amy,DESK[n]);      // read analyst desks
    else if(n==='theo') pathTo(n,DESK.baldy,DESK.hairy,DESK.theo);         // collect the debate
    else pathTo(n,DESK[n]);
  }
  if(st==='done') pathTo(n,COFFEE,DESK[n]);                                 // victory coffee
}
function stepWalks(){
  for(const n in AGENTS){ const a=AGENTS[n];
    if(!a.path.length) continue;
    const [tx,ty]=a.path[0], dx=tx-a.x, dy=ty-a.y, d=Math.hypot(dx,dy);
    if(d<3){ a.path.shift(); continue; }
    const sp=2.2; a.x+=dx/d*sp; a.y+=dy/d*sp; a.walking=true; return; }
}
setInterval(()=>{ for(const n in AGENTS) AGENTS[n].walking=false; stepWalks(); }, 16);
/* ambient life when idle */
setInterval(()=>{ if(runTicker) return;
  const names=Object.keys(AGENTS), n=names[Math.floor(Math.random()*names.length)];
  const a=AGENTS[n]; if(a.path.length) return;
  pathTo(n, Math.random()<0.5?COFFEE:COOLER, DESK[n]);
  a.note=AMBIENT[Math.floor(Math.random()*AMBIENT.length)]; a.ts=Date.now()/1000;
}, 22000);

/* ============================ drawing ============================ */
const SPRITE=new Image(); SPRITE.src='/assets/agents.png';
const SPRITE_COL={tom:0,john:1,david:2,amy:3,baldy:4,hairy:5,theo:6};
cx.imageSmoothingEnabled=false;
function rect(x,y,w,h,c){ cx.fillStyle=c; cx.fillRect(x,y,w,h); }
function shadow(x,y,rx,ry){ cx.fillStyle='rgba(20,10,5,.30)';
  cx.beginPath(); cx.ellipse(x,y,rx,ry,0,0,7); cx.fill(); }
function lightPool(x,y,r){ const g=cx.createRadialGradient(x,y,4,x,y,r);
  g.addColorStop(0,'rgba(255,205,130,.14)'); g.addColorStop(1,'rgba(255,205,130,0)');
  cx.fillStyle=g; cx.fillRect(x-r,y-r,r*2,r*2); }
function vignette(){ const g=cx.createRadialGradient(W/2,H/2,H/3,W/2,H/2,H*0.95);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(8,4,16,.42)');
  cx.fillStyle=g; cx.fillRect(0,0,W,H); }
function plant(x,y){ rect(x,y+12,16,12,'#7a4a2a'); rect(x+2,y-2,4,16,'#3f7d3f');
  rect(x+7,y-6,4,20,'#4f9d4f'); rect(x+12,y,4,14,'#3f7d3f'); }
function clock(x,y){ cx.fillStyle='#ddd'; cx.beginPath(); cx.arc(x,y,11,0,7); cx.fill();
  cx.strokeStyle='#222'; cx.lineWidth=2; cx.stroke();
  const d=new Date(),a1=(d.getHours()%12+d.getMinutes()/60)*Math.PI/6-Math.PI/2,
        a2=d.getMinutes()*Math.PI/30-Math.PI/2;
  cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+Math.cos(a1)*5,y+Math.sin(a1)*5); cx.stroke();
  cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+Math.cos(a2)*8,y+Math.sin(a2)*8); cx.stroke(); }
function coffeeMachine(x,y){ rect(x-10,y-22,20,26,'#333a45'); rect(x-6,y-18,12,8,'#111');
  rect(x-4,y-6,8,6,'#b05555'); cx.fillStyle='#888'; cx.fillRect(x-10,y-26,20,4);
  if(Math.floor(Date.now()/600)%2) rect(x-1,y-32,2,5,'#aaa'); }        // steam
function cooler(x,y){ rect(x-8,y-24,16,28,'#7fb2d9'); rect(x-6,y-30,12,8,'#a8d4f2'); }
const F_PX='"Press Start 2P","Courier New",monospace';
const F_MONO='"JetBrains Mono","Courier New",monospace';
function skyPalette(){ const h=new Date().getHours()+new Date().getMinutes()/60;
  if(h<5.5||h>=21) return {sky:'#0a1030',glow:'#1a2246',sun:null,night:true};
  if(h<8)  return {sky:'#e8935c',glow:'#f6c07a',sun:'#ffe9b0',night:false};
  if(h<17) return {sky:'#7ec3e8',glow:'#a5d8f2',sun:'#fff3c4',night:false};
  if(h<20) return {sky:'#d97a4e',glow:'#f0a35e',sun:'#ffd9a0',night:false};
  return {sky:'#20204a',glow:'#33305e',sun:null,night:true}; }
function drawWindow(x,w){ const p=skyPalette(), y=55, h=18;
  rect(x-2,y-2,w+4,h+4,'#3d2c1c');                      // frame
  const g=cx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,p.sky); g.addColorStop(1,p.glow);
  cx.fillStyle=g; cx.fillRect(x,y,w,h);
  if(p.sun){ cx.fillStyle=p.sun; cx.fillRect(x+w-14,y+3,5,5); }
  if(p.night){ cx.fillStyle='#fff';                     // stars
    for(let i=0;i<5;i++) cx.fillRect(x+6+(i*w/5+((i*37)%7)),y+2+((i*13)%6),1,1); }
  // skyline
  cx.fillStyle=p.night?'#05050f':'#3a4a5a';
  const hs=[7,10,5,12,8,6,11,9];
  hs.forEach((bh,i)=>{ const bx=x+2+i*(w-4)/8; cx.fillRect(bx,y+h-bh,(w-4)/8-1,bh);
    if(p.night){ cx.fillStyle='#ffd977';
      cx.fillRect(bx+1,y+h-bh+2,1,1); cx.fillRect(bx+2,y+h-bh+5,1,1);
      cx.fillStyle='#05050f'; } });
  rect(x+w/2-1,y,2,h,'#3d2c1c');                        // mullion
}
let HIST={verdicts:[],bulls:0,bears:0};
async function loadHistory(){ try{ const r=await fetch('/api/history');
  if(r.ok) HIST=await r.json(); }catch{} }
loadHistory();
const TIERC2={strong_positive:'#2e9e5b',positive:'#46c47c',neutral:'#e2bd6b',
              negative:'#e05a5a',strong_negative:'#b03030'};
function whiteboard(x,y){                       // real bulls-vs-bears tally
  rect(x-2,y-2,104,64,'#8a6b45'); rect(x,y,100,60,'#f2efe4');
  cx.font='7px '+F_PX; cx.textAlign='left';
  cx.fillStyle='#2e7d4f'; cx.fillText('BULLS',x+6,y+14);
  cx.fillStyle='#a33'; cx.fillText('BEARS',x+6,y+40);
  const tally=(count,ty,c)=>{ cx.strokeStyle=c; cx.lineWidth=2;
    for(let i=0;i<Math.min(count,12);i++){ const gx=x+52+(i%6)*7, gy=ty+((i>5)?12:0);
      cx.beginPath(); cx.moveTo(gx,gy); cx.lineTo(gx,gy+9); cx.stroke(); } };
  tally(HIST.bulls,y+6,'#2e7d4f'); tally(HIST.bears,y+32,'#a33');
}
function corkboard(x,y){                        // last 5 verdict cards
  rect(x-3,y-3,116,56,'#6d4a29'); rect(x,y,110,50,'#b98d5e');
  const vs=HIST.verdicts.slice(0,5);
  cx.font='5px '+F_PX; cx.textAlign='left';
  vs.forEach((v,i)=>{ const cxp=x+6+i*21, cyp=y+8+(i%2)*20;
    rect(cxp,cyp,18,16,'#fffef0'); rect(cxp,cyp,18,4,TIERC2[v.tier]||'#777');
    rect(cxp+8,cyp-1,2,2,'#c33');
    cx.fillStyle='#222'; cx.fillText(v.ticker.slice(0,4),cxp+1,cyp+12); });
  if(!vs.length){ cx.fillStyle='#7a5c3a'; cx.font='6px '+F_PX;
    cx.fillText('NO VERDICTS',x+14,y+28); }
}
function poster(x,y){                           // framed pixel car
  rect(x-2,y-2,52,40,'#8a6b45'); rect(x,y,48,36,'#1c2438');
  rect(x+8,y+16,32,10,'#c9403f'); rect(x+14,y+10,18,8,'#e8dede');
  rect(x+12,y+24,7,6,'#222'); rect(x+30,y+24,7,6,'#222');
  rect(x+13,y+25,3,3,'#888'); rect(x+31,y+25,3,3,'#888');
}
function certificate(x,y){
  rect(x-2,y-2,40,50,'#8a6b45'); rect(x,y,36,46,'#f2efe4');
  cx.fillStyle='#99a'; for(let i=0;i<5;i++) cx.fillRect(x+5,y+7+i*6,26,2);
  rect(x+13,y+37,9,6,'#e2bd6b');
}
function breakroom(){                           // counter, fridge, snacks, table
  rect(444,496,96,8,'#6d4a29'); rect(444,504,96,26,'#54381e');   // counter
  rect(450,470,18,30,'#c8ccd8'); rect(452,474,14,10,'#9aa0b0');  // fridge
  rect(452,486,14,2,'#9aa0b0');
  rect(516,470,20,14,'#6d4a29');                                  // snack shelf
  rect(518,472,5,8,'#d9a24a'); rect(525,472,5,8,'#b0559a'); rect(531,472,4,8,'#5b8ac4');
  shadow(480,552,16,5); rect(468,536,26,14,'#6d4a29');            // table
}
const PROPS={
  tom(x,y){ rect(x+52,y-50,20,16,'#cfd6e4'); rect(x+54,y-48,16,11,'#12333f');
    if(Math.floor(Date.now()/400)%2) rect(x+56,y-45,6,2,'#2fd07a'); rect(x+58,y-34,8,3,'#4a3018'); },
  john(x,y){ rect(x-76,y-54,18,30,'#8b93a5'); rect(x-74,y-48,14,2,'#5c6474');
    rect(x-74,y-40,14,2,'#5c6474'); rect(x-74,y-32,14,2,'#5c6474');
    rect(x+30,y-32,10,7,'#2a2e3c'); rect(x+31,y-31,8,2,'#9fe3b5'); },   // calculator
  david(x,y){ rect(x+52,y-54,26,20,'#22242e');
    cx.fillStyle=['#3b6ea5','#a53b52','#3ba56e'][Math.floor(Date.now()/500)%3];
    cx.fillRect(x+54,y-52,22,14); rect(x+60,y-34,10,4,'#4a3018'); },

const statusEl=document.getElementById('status'), consoleEl=document.getElementById('console');
function clog(e){
  const d=new Date(e.ts*1000).toTimeString().slice(0,8);
  const cls=e.state==='find'?'find':'';
  const div=document.createElement('div'); div.className='l';
  div.innerHTML=`<span class="t">${d}</span> <span class="a">${e.agent.toUpperCase()}</span> `+
    `<span class="${cls}">${e.state==='find'?'💡 ':''}${(e.note||e.state)}</span>`;
  consoleEl.appendChild(div);
  while(consoleEl.children.length>200) consoleEl.removeChild(consoleEl.firstChild);
  consoleEl.scrollTop=consoleEl.scrollHeight;
}
const es=new EventSource('/api/events');
es.onmessage=(m)=>{ let e; try{ e=JSON.parse(m.data);}catch{return;}
  const fresh=Date.now()/1000-e.ts<45;   // replayed history animates, never toasts
  if(e.agent!=='floor') clog(e);
  if(e.agent==='floor'){
    clog(e);
    if(!fresh){ if(e.state==='run_start') runTicker=e.ticker;
      if(e.state==='run_done'||e.state==='error') runTicker=null;
      return; }
    if(e.state==='run_start'){ runTicker=e.ticker; setBusy(true);
      screens.chart=null; screens.headlines=[]; screens.sentiment=null;
      stageIdx=-1; rStarts=0;
      if(e.ticker!=='DIGEST') setStage(0);
      for(const n in AGENTS){ const a=AGENTS[n];
        a.mode='idle'; a.note=''; a.history=[]; a.path=[DESK[n]]; } }
    if(e.state==='stall'){ toast('⚠ '+e.note, true); statusEl.textContent=e.note; }
    if(e.state==='error'){ toast('✕ '+(e.note||'run failed')); }
    if(e.state==='run_done'||e.state==='error'){ setBusy(false);
      statusEl.textContent=e.state==='run_done'?'run complete':'run failed';
      if(e.state==='run_done'){ if(e.ticker==='DIGEST') loadDigest();
        else { showVerdict(e.ticker); loadScore(); loadHistory();
               toast('✓ '+e.ticker+' verdict is in', true); } }
      runTicker=null; stageIdx=-1; renderStages(); }
    return; }
  if(!(e.agent in AGENTS)) return;
  const a=AGENTS[e.agent];
  a.history.push(e); if(a.history.length>80) a.history.shift();
  if(e.state==='data'&&e.payload){ const p=e.payload;
    if(p.kind==='chart') screens.chart=p.value;
    if(p.kind==='headlines') screens.headlines=p.value;
    if(p.kind==='sentiment') screens.sentiment=p.value;
    if(p.kind==='quote') screens.quote=p.value;
    return; }
  if(e.state==='find'){                          // rival reacts at the table
    if(e.agent==='baldy'&&AGENTS.hairy) AGENTS.hairy.react={sym:'?!',c:'#a33',ts:e.ts};
    if(e.agent==='hairy'&&AGENTS.baldy) AGENTS.baldy.react={sym:'!',c:'#2e7d4f',ts:e.ts}; }
  const mode={start:'work',work:'work',find:'work',write:'write',done:'done',error:'idle'}[e.state]||'idle';
  if(e.state==='start'){ a.startTs=e.ts; choreo(e.agent,'start');
    if(e.agent==='baldy'||e.agent==='hairy'){ rStarts++; setStage(rStarts<=2?1:2); }
    if(e.agent==='theo'&&runTicker!=='DIGEST') setStage(3); }
  if(e.state==='done') choreo(e.agent,'done');
  a.mode=mode; a.note=e.note||''; a.ts=e.ts;
  statusEl.textContent=e.agent.toUpperCase()+': '+(e.note||e.state);
  if(dossierAgent===e.agent) renderDossier(e.agent);
};

/* ============================ panels (digest/verdict/score/macro/tape) ============ */
function inline(s){ return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\*(.+?)\*/g,'<i>$1</i>'); }
function mdToHtml(md){
  // block-based: wrapped source lines join into real paragraphs
  const lines=md.replace(/^---[\s\S]*?---\n/,'').split('\n');
  const out=[]; let para=[], rows=[], section='';
  const flushP=()=>{ if(para.length){
    const txt=inline(para.join(' '));
    const mover=section==='movers'&&/^<b>[A-Z]{1,5}<\/b>/.test(txt);
    out.push(mover?`<div class="mover">${txt}</div>`:`<p>${txt}</p>`); para=[]; } };
  const flushT=()=>{ if(rows.length){
    out.push('<table>'+rows.join('')+'</table>'); rows=[]; } };
  for(const raw of lines){ const l=raw.trimEnd();
    if(!l.trim()){ flushP(); flushT(); continue; }
    if(/^#{1,3} /.test(l)){ flushP(); flushT();
      const t=l.replace(/^#+ /,'');
      section=t.toLowerCase().includes('mover')?'movers':t.toLowerCase();
      if(!/^# /.test(l)) out.push('<h3>'+inline(t)+'</h3>');   // drop the top h1
      continue; }
    if(/^\|/.test(l)){ flushP();
      if(/^\|[\s\-|]+\|$/.test(l)) continue;                    // separator row
      rows.push('<tr>'+l.slice(1,-1).split('|').map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>');
      continue; }
    if(/^- /.test(l)){ flushP(); flushT();
      out.push('<li>'+inline(l.slice(2))+'</li>'); continue; }
    para.push(l.trim()); }
  flushP(); flushT();
  return out.join('');
}
const ALL_TICKERS=['TSLA','TM','F','GM','STLA','HMC','RIVN','LCID','NIO','XPEV','LI','PSNY'];
function linkTickers(html){
  const re=new RegExp('\\b('+ALL_TICKERS.join('|')+')\\b','g');
  return html.replace(re,'<span class="tk" onclick="showVerdict(\'$1\')">$1</span>');
}
async function loadDigest(){ const r=await fetch('/api/digest'); if(!r.ok) return;
  const d=await r.json();
  document.getElementById('digest').innerHTML=
    '<h2>MORNING DIGEST — '+d.date+'</h2>'+linkTickers(mdToHtml(d.markdown)); }
loadDigest();
async function showVerdict(t){ const r=await fetch('/api/verdict/'+t); if(!r.ok) return;
  const v=await r.json();
  document.getElementById('verdict').innerHTML=`<h2>${t} — FIRM VERDICT</h2>
    <div><span class="tier ${v.stance}">OVERALL ${(v.stance||'').replace('_',' ').toUpperCase()}</span></div>
    <div style="margin:7px 0">
      <span class="tier ${v.financial_outlook}">FIN ${(v.financial_outlook||'?').replace('_',' ')}</span>
      <span class="tier ${v.engineering_health}">ENG ${(v.engineering_health||'?').replace('_',' ')}</span></div>
    <div>confidence <b>${v.confidence}</b> &middot; ${v.horizon_months}mo &middot; ${v.date}</div>
    <ul>${(v.key_findings||[]).map(k=>'<li>'+k+'</li>').join('')}</ul>
    <div class="path">${v.path}</div>`; }
const TIERC={strong_positive:'#2e9e5b',positive:'#4caf6e',neutral:'#e8c56a',
             negative:'#e05555',strong_negative:'#b03030'};
async function loadScore(){ const r=await fetch('/api/scoreboard'); if(!r.ok) return;
  const d=await r.json();
  document.getElementById('score').innerHTML=Object.entries(d).map(([t,s])=>{
    const pc=s.pct==null?'flat':s.pct>0.05?'up':s.pct<-0.05?'down':'flat';
    const ps=s.pct==null?'—':(s.pct>0?'+':'')+s.pct.toFixed(1)+'%';
    const vc=s.verdict?TIERC[s.verdict.tier]||'#333':'#333';
    const age=s.verdict?s.verdict.age_days+'d':'unrated';
    return `<div class="s-cell card" onclick="showVerdict('${t}')">
      <div class="t">${t}</div><div class="p ${pc}">${ps}</div>
      <div class="v" style="background:${vc}"></div><div class="age">${age}</div></div>`;
  }).join(''); }
loadScore(); setInterval(loadScore,5*60*1000);
async function loadMacro(){ const r=await fetch('/api/macro'); if(!r.ok) return;
  const d=await r.json(), el=document.getElementById('macro');
  el.innerHTML=Object.entries(d).map(([sid,m])=>
    `<div class="m-card card"><div><div class="lab">${m.label}</div>
     <div class="val">${m.error?'—':m.latest.toLocaleString()}</div></div>
     <canvas id="spark-${sid}" width="90" height="30"></canvas></div>`).join('');
  for(const [sid,m] of Object.entries(d)){ if(m.error||!m.series) continue;
    const c=document.getElementById('spark-'+sid).getContext('2d');
    const lo=Math.min(...m.series), hi=Math.max(...m.series)||1;
    c.strokeStyle='#8d79c9'; c.lineWidth=2; c.beginPath();
    m.series.forEach((v,i)=>{ const x=4+i*(82/(m.series.length-1)),
      y=26-((v-lo)/((hi-lo)||1))*22; i?c.lineTo(x,y):c.moveTo(x,y); });
    c.stroke(); } }
loadMacro(); setInterval(loadMacro,30*60*1000);
async function tape(){ try{ const r=await fetch('/api/tape'); const d=await r.json();
  document.getElementById('tape-inner').innerHTML=Object.entries(d).map(([t,m])=>{
    if(m.pct==null) return `<span class="flat">${t} ?</span>`;
    const cls=m.pct>0.05?'up':m.pct<-0.05?'down':'flat', s=m.pct>0?'+':'';
    return `<span class="${cls}">&nbsp;&nbsp;${t} $${m.close} ${s}${m.pct.toFixed(2)}%&nbsp;&nbsp;</span>`;
  }).join('▪'); }catch{} }
tape(); setInterval(tape,5*60*1000);
</script>
